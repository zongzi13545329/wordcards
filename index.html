<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="词卡速刷">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>词卡速刷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Gentium+Book+Plus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html { box-sizing: border-box; color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one-screen phone app — top bar, scrolling view on faint grid paper, bottom tab bar; drill and practice modes take the whole screen. */
:root {
  --paper: #F3F5F9; --card: #FFFFFF; --ink: #17233F; --ink-2: #56627C; --ink-3: #8A94AA;
  --line: #DCE2EC; --grid: rgba(47, 91, 211, .06); --accent: #2F5BD3; --accent-soft: #E3EAFB;
  --hi: #FFE86A; --hi-ink: #17233F; --chart: #2F5BD3; --good: #17875C; --good-soft: #DDF3E9; --bad: #CC3F33; --bad-soft: #FBE3E0;
  --shadow: 0 1px 2px rgba(23,35,63,.06), 0 6px 20px rgba(23,35,63,.07);
  --f-word: "Literata", "Noto Serif", Georgia, serif;
  --f-ipa: "Gentium Book Plus", "Charis SIL", "Doulos SIL", "Noto Serif", serif;
  --f-body: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F131C; --card: #171E2D; --ink: #E6EBF5; --ink-2: #A3AEC6; --ink-3: #6E7A93;
  --line: #29324A; --grid: rgba(125, 155, 255, .05); --accent: #86A2FF; --accent-soft: #222E4D;
  --hi: #6B5A12; --hi-ink: #FFF4C2; --chart: #6A8BF0; --good: #4CC995; --good-soft: #15382B; --bad: #F2786B; --bad-soft: #3E1F1E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0F131C; --card: #171E2D; --ink: #E6EBF5; --ink-2: #A3AEC6; --ink-3: #6E7A93;
  --line: #29324A; --grid: rgba(125, 155, 255, .05); --accent: #86A2FF; --accent-soft: #222E4D;
  --hi: #6B5A12; --hi-ink: #FFF4C2; --chart: #6A8BF0; --good: #4CC995; --good-soft: #15382B; --bad: #F2786B; --bad-soft: #3E1F1E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 52px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar h1 { font: 650 19px/1.2 var(--f-word); margin: 0; flex: 1; min-width: 0; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { font: 500 12px var(--f-mono); color: var(--ink-3); }
.view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; background-attachment: local;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 24px; }
.view > * + * { margin-top: 14px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--card); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { border: 0; background: none; padding: 9px 0 8px; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--ink-3); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="true"] { color: var(--accent); font-weight: 600; }

.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.iconbtn:active { background: var(--accent-soft); }
.iconbtn svg { width: 22px; height: 22px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.label { font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.big { width: 100%; padding: 15px; font-size: 16px; border-radius: 14px; font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding: 8px 10px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; }

/* Home */
.bookcard h2 { font: 650 22px/1.25 var(--f-word); margin: 4px 0 2px; text-wrap: balance; }
.roundline { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
.roundline .big { font: 500 30px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font: 500 24px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.tile.warn b { color: var(--bad); }
.rounds { display: grid; gap: 8px; margin-top: 10px; }
.rnd { display: grid; grid-template-columns: 44px 1fr 64px; align-items: center; gap: 8px; font-size: 12px; }
.rnd .track { position: relative; height: 14px; }
.rnd .seg { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.rnd .ok { background: var(--good); }
.rnd .no { background: var(--bad); opacity: .85; }
.rnd .t { text-align: right; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Drill */
.drill { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.drill-top { display: flex; align-items: center; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 52px; }
.chip { font: 500 12px var(--f-mono); padding: 4px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.thinbar { height: 3px; background: var(--line); }
.thinbar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.stage { flex: 1; overflow-y: auto; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; }
.indexcard { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 28px 20px 22px;
  background-image: linear-gradient(transparent 31px, var(--line) 31px, var(--line) 32px, transparent 32px); background-size: 100% 32px; background-position: 0 70px; background-repeat: repeat-y; }
.indexcard::before { content: ""; position: absolute; left: 0; right: 0; top: 58px; height: 2px; background: var(--bad); opacity: .35; }
.headword { font: 650 clamp(34px, 11vw, 46px)/1.1 var(--f-word); text-align: center; word-break: break-word; letter-spacing: -.005em; }
.ipa { font: 400 19px/1.4 var(--f-ipa); color: var(--ink-2); text-align: center; display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.speak { border: 0; background: var(--accent-soft); color: var(--accent); width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.speak svg { width: 18px; height: 18px; }
.speak.sm { width: 28px; height: 28px; }
.speak.sm svg { width: 15px; height: 15px; }
.meaning { margin-top: 18px; font-size: 17px; line-height: 1.6; }
.pos { font: italic 400 15px var(--f-ipa); color: var(--accent); margin-right: 6px; }
.verdict { text-align: center; font-weight: 600; font-size: 13px; margin-top: 16px; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 16px; }
.ans { border-radius: 16px; padding: 18px 8px; font-size: 18px; font-weight: 600; border: 2px solid; background: var(--card); }
.ans.yes { border-color: var(--good); color: var(--good); }
.ans.no { border-color: var(--bad); color: var(--bad); }
.ans.wide { grid-column: 1 / -1; }
.ans.solid { background: var(--accent); border-color: var(--accent); color: var(--card); }
.ans small { display: block; font: 500 11px var(--f-mono); opacity: .7; margin-top: 2px; }

.sect { margin-top: 18px; }
.sect h4 { margin: 0 0 8px; }
.ex { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 10px 0; border-top: 1px dashed var(--line); }
.ex:first-of-type { border-top: 0; padding-top: 2px; }
.ex .en { font-family: var(--f-word); font-size: 16px; line-height: 1.5; }
.ex .zh { grid-column: 1; color: var(--ink-2); font-size: 14px; }
mark { background: var(--hi); color: var(--hi-ink); border-radius: 3px; padding: 0 2px; }
.phr { display: flex; flex-wrap: wrap; gap: 8px; }
.phr span { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 14px; background: var(--paper); }
.phr b { font-family: var(--f-word); font-weight: 500; margin-right: 6px; }

/* Lists */
.list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.item:first-child { border-top: 0; }
.item .w { font: 500 17px var(--f-word); }
.item .m { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font: 500 11px var(--f-mono); color: var(--ink-3); flex: none; }
.daygroup { padding: 8px 14px; background: var(--paper); font: 500 12px var(--f-mono); color: var(--ink-3); border-top: 1px solid var(--line); }
.daygroup:first-child { border-top: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.answers.three { grid-template-columns: repeat(3, 1fr); }
.ans.timer { position: relative; overflow: hidden; }
.ans.timer::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: currentColor; opacity: .45; animation: adv-tick var(--t) linear forwards; }
@keyframes adv-tick { to { width: 100%; } }
.tagrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.tagbtn { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 5px 12px; font-size: 13px; color: var(--ink-2); }
.tagbtn.mean[aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.tagbtn.pron[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tg { font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 6px; flex: none; }
.tg.mean { background: var(--bad-soft); color: var(--bad); }
.tg.pron { background: var(--accent-soft); color: var(--accent); }
.seg2.typeseg { display: flex; }
.pnote { margin-top: 12px; display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; line-height: 1.55; }
.srcsel { display: flex; align-items: center; gap: 10px; }
.srcsel select { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; }
.modegroup { display: grid; gap: 6px; }
.modes.three { grid-template-columns: repeat(3, 1fr); }
.modes.two { grid-template-columns: repeat(2, 1fr); }
.answers.four { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.answers.four .ans { font-size: 15px; padding: 14px 2px; }
.sentbox { width: 100%; margin-top: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); padding: 10px 12px; font: 400 17px/1.5 var(--f-word); resize: vertical; }
.sentbox:focus { outline: none; border-color: var(--accent); }
.sdres { margin-top: 14px; font: 400 18px/1.8 var(--f-word); }
.sdres .sok { color: var(--good); }
.sdres .swr { color: var(--bad); font-weight: 600; }
.sdres .swr s { color: var(--ink-3); font-weight: 400; font-size: .85em; }
.sdres .smi { color: var(--ink-3); text-decoration: underline dotted; text-underline-offset: 4px; }
.sdres .sx { color: var(--ink-3); font-size: .85em; }
.sdres .hd { border-bottom: 2px solid var(--accent); }
.indexcard.plain { background-image: none; padding-top: 20px; }
.indexcard.plain::before { display: none; }
.clozeq.colq { text-align: center; font-size: 22px; }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 14px; font-size: 15px; line-height: 1.4; }
.opt .ow { font: 500 18px var(--f-word); }
.optk { font-size: 12px; color: var(--ink-3); width: 14px; flex: none; }
.optmark { font-weight: 700; flex: none; }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.opt.dim { opacity: .5; }
.clozeq { font: 400 19px/1.65 var(--f-word); }
.clozeq .blank { display: inline-block; border-bottom: 2px solid var(--accent); margin: 0 3px; }
.clozezh { margin-top: 10px; color: var(--ink-2); font-size: 14px; }
.donebig { font: 500 40px/1.1 var(--f-mono); margin: 10px 0 4px; }
.tile b small { font: 400 13px var(--f-body); color: var(--ink-3); }
.chart { width: 100%; height: auto; display: block; margin-top: 8px; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--ink-3); stroke-width: 1; }
.chart .ax { fill: var(--ink-3); font: 500 10px var(--f-mono); }
.chart .ax.strong { fill: var(--ink); }
.chart .val { fill: var(--ink); font: 600 11px var(--f-mono); }
.chart .bar { fill: var(--chart); opacity: .55; }
.chart .bar.sel { opacity: 1; }
.chart [data-bar] { cursor: pointer; }
.chart .line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; }
.chart .area { fill: var(--chart); opacity: .12; }
.chart .dot { fill: var(--chart); stroke: var(--card); stroke-width: 2; }
.chart.hmap { max-width: 240px; margin-left: auto; margin-right: auto; }
.hm.l0 { fill: var(--line); } .hm.l1 { fill: var(--chart); opacity: .3; } .hm.l2 { fill: var(--chart); opacity: .55; } .hm.l3 { fill: var(--chart); opacity: .8; } .hm.l4 { fill: var(--chart); }
.chartcap { margin: 6px 0 0; }
.typeseg button { flex: 1; }
.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mode { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 4px 10px; display: grid; justify-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.mode svg { width: 24px; height: 24px; color: var(--accent); }
.mode:disabled { opacity: .45; }
.search { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; }
.empty { text-align: center; padding: 28px 16px; color: var(--ink-2); }
.empty b { display: block; font: 650 18px var(--f-word); color: var(--ink); margin-bottom: 6px; }

/* Library / import */
.book { display: grid; gap: 8px; }
.book h3 { font: 650 17px var(--f-word); margin: 0; }
.badge { font: 500 11px var(--f-mono); padding: 2px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.badge.demo { background: var(--hi); color: var(--hi-ink); }
.field { display: grid; gap: 6px; }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; }
.field textarea { min-height: 180px; font: 13px/1.5 var(--f-mono); resize: vertical; }
pre.fmt { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.5 var(--f-mono); overflow-x: auto; margin: 6px 0 0; white-space: pre; }
.status { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); }
.status.err { background: var(--bad-soft); }

/* Settings */
.setrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.setrow:first-child { border-top: 0; }
.setrow .grow small { display: block; color: var(--ink-3); font-size: 12px; }
.seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg2 button { border: 0; background: var(--card); padding: 6px 12px; font-size: 13px; }
.seg2 button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.switch { appearance: none; width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { left: 21px; }
input[type="range"] { accent-color: var(--accent); width: 120px; }

/* Practice modes */
.spellbox { width: 100%; text-align: center; font: 500 26px var(--f-word); border: 0; border-bottom: 2px solid var(--line); background: transparent; padding: 8px 0; margin-top: 18px; }
.spellbox:focus { outline: none; border-color: var(--accent); }
.hintline { text-align: center; font: 500 20px var(--f-mono); letter-spacing: .25em; color: var(--ink-3); margin-top: 12px; }
.result { text-align: center; margin-top: 14px; font-weight: 600; }
.result.good { color: var(--good); } .result.bad { color: var(--bad); }
.result .correct { display: block; font: 650 26px var(--f-word); color: var(--ink); margin-top: 4px; }
.player { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 22px; }
.player .iconbtn { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); }
.player .play { width: 68px; height: 68px; background: var(--accent); color: var(--card); border: 0; }
.player .play svg { width: 30px; height: 30px; }

/* Sheet + dialog */
.scrim { position: fixed; inset: 0; background: rgba(10, 15, 28, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; border-radius: 20px 20px 0 0; padding-block: 10px max(20px, env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
.dialog { align-self: center; background: var(--card); border-radius: 18px; padding: 20px; width: calc(100% - 48px); max-width: 360px; display: grid; gap: 14px; }
.dialog h3 { margin: 0; font: 650 18px var(--f-word); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--card); padding: 9px 16px; border-radius: 99px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }
.splash { flex: 1; display: grid; place-items: center; color: var(--ink-3); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = () => dkey(new Date());
const dayLabel = d => { const [y,m,dd] = d.split('-'); return (y == new Date().getFullYear() ? '' : y + '年') + (+m) + '月' + (+dd) + '日'; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const key = w => String(w).trim().toLowerCase();
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }
function highlight(text, w) {
  const t = esc(text); if (!w) return t;
  let stem = w.toLowerCase(); if (stem.length > 4 && /e$/.test(stem)) stem = stem.slice(0, -1);
  if (stem.includes(' ')) stem = stem.split(' ')[0];
  stem = stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return t.replace(new RegExp('\\b(' + stem + '[a-z]*)', 'gi'), '<mark>$1</mark>'); } catch { return t; }
}

/* ---------- Storage: shared artifact store when available, this browser otherwise ---------- */
/* IndexedDB key-value store: word books are several MB, more than localStorage allows */
const KV = (() => {
  let dbp = null; const mem = new Map();
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('wordcards', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', mode); const req = fn(t.objectStore('kv')); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    async get(k, d) { try { const v = await run('readonly', st => st.get(k)); return v === undefined ? d : v; } catch { return mem.has(k) ? mem.get(k) : d; } },
    async set(k, v) { try { await run('readwrite', st => st.put(v, k)); } catch (e) { mem.set(k, v); if (e && /quota/i.test(e.name || '')) throw { code: 'quota_exceeded' }; } },
    async del(k) { try { await run('readwrite', st => st.delete(k)); } catch { mem.delete(k); } },
  };
})();

  db: null, mode: 'local',

/* ---------- App state ---------- */
const DEFAULTS = { current: DEMO_ID, accent: 'en-GB', rate: 0.9, autoSpeak: true, advanceDelay: 0, shuffle: true, listenZh: true, listenEx: true, sessionSize: 20, voice: 'online' };

  view: 'home', reveal: null, last: null,

/* Progress writes: one at a time, coalesced */

async function loadBook(id) {

async function boot() {

/* ---------- Speech ---------- */
const TTS = 'speechSynthesis' in window;
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch {} }
if (TTS) { loadVoices(); try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch {} }
function pickVoice(lang) {
  const l = lang.toLowerCase(); const exact = voices.filter(v => v.lang.replace('_', '-').toLowerCase() === l);
  return exact.find(v => /google|natural|premium|enhanced/i.test(v.name)) || exact[0] || voices.find(v => v.lang.toLowerCase().startsWith(l.slice(0, 2)));
}
function sysSpeak(text, lang, { cancel = false, slow = false } = {}) {
  if (!TTS || !text) return Promise.resolve();
  return new Promise(res => {
    try {
      if (cancel) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'zh' ? 'zh-CN' : S.settings.accent;
      const v = pickVoice(u.lang); if (v) u.voice = v;
      u.rate = lang === 'zh' ? 1 : S.settings.rate * (slow ? 0.75 : 1);
      let done = false; const fin = () => { if (!done) { done = true; res(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 1500 + text.length * 140);   /* some Android builds never fire onend */
      speechSynthesis.speak(u);
    } catch { res(); }
  });
}
/* Online audio from Youdao's dictionary voice service: plays in any browser, no speech engine needed */
const AUD = new Audio(); AUD.preload = 'auto';
const onlineUrl = (text, lang) => lang === 'zh'
  ? 'https://dict.youdao.com/dictvoice?le=zh&audio=' + encodeURIComponent(text)
  : 'https://dict.youdao.com/dictvoice?type=' + (S.settings.accent === 'en-GB' ? 1 : 2) + '&audio=' + encodeURIComponent(text);
function playOnline(text, lang, slow) {
  return new Promise(res => {
    let done = false; const fin = ok => { if (!done) { done = true; res(ok); } };
    try {
      AUD.pause(); AUD.src = onlineUrl(text, lang);
      AUD.playbackRate = lang === 'zh' ? 1 : Math.min(1.2, Math.max(0.5, (S.settings.rate + 0.1) * (slow ? 0.75 : 1)));
      AUD.onended = () => fin(true); AUD.onerror = () => fin(false);
      const p = AUD.play(); if (p && p.catch) p.catch(() => fin(false));
      setTimeout(() => fin(!AUD.error), 4000 + text.length * 160);
    } catch { fin(false); }
  });
}
const hasSysVoice = lang => TTS && (!voices.length || voices.some(v => v.lang.toLowerCase().startsWith(lang === 'zh' ? 'zh' : 'en')));
const canSpeak = () => S.settings.voice === 'online' || hasSysVoice('en');
async function speak(text, lang, opts = {}) {
  if (!text) return;
  if (S.settings.voice === 'online' && navigator.onLine !== false) {
    if (opts.cancel) { try { speechSynthesis.cancel(); } catch {} }
    if (await playOnline(text, lang, opts.slow)) return;
  }
  if (hasSysVoice(lang)) return sysSpeak(text, lang, opts);
}
function stopAudio() { try { AUD.pause(); } catch {} try { speechSynthesis.cancel(); } catch {} }
const say = (t, lang) => speak(t, lang, { cancel: true });

/* ---------- Cross-book wrong-word book: one entry per word, holding a copy of its card and the books it came from ---------- */
const NB = 16;
const WB = { items: {}, migrated: false, saved: [], metaSaved: false };
const W = () => WB.items;
const card = w => S.wmap.get(w) || (WB.items[w] && WB.items[w].card) || null;
const bucketOf = w => { let h = 0; for (const c of w) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % NB; };
function bucketJSON(i) { const o = {}; for (const [k, v] of Object.entries(WB.items)) if (bucketOf(k) === i) o[k] = v; return JSON.stringify(o); }
async function loadWrong() {
  try {
    if (Store.db) {
      const docs = await Promise.all([...Array.from({ length: NB }, (_, i) => Store.db.doc('wrongbook/b' + i).get()), Store.db.doc('wrongbook/meta').get()]);
      WB.items = {}; docs.slice(0, NB).forEach(d => { if (d.exists) Object.assign(WB.items, JSON.parse(JSON.stringify(d.data().items || {}))); });
      WB.migrated = WB.metaSaved = !!(docs[NB].exists && docs[NB].data().migrated);
    } else { const o = await KV.get('wrong', null); WB.items = (o && o.items) || {}; WB.migrated = !!(o && o.migrated); }
  } catch { WB.items = {}; }
  WB.saved = Array.from({ length: NB }, (_, i) => bucketJSON(i));
}
let wbBusy = false, wbDirty = false, wbTimer = null;
function saveWrong(now) { wbDirty = true; clearTimeout(wbTimer); wbTimer = setTimeout(flushWrong, now ? 0 : 700); }
async function flushWrong() {
  if (wbBusy || !wbDirty) return; wbBusy = true; wbDirty = false;
  try {
    if (Store.db) {
      for (let i = 0; i < NB; i++) { const j = bucketJSON(i); if (j !== WB.saved[i]) { await Store.db.doc('wrongbook/b' + i).set({ items: JSON.parse(j) }); WB.saved[i] = j; } }
      if (WB.migrated && !WB.metaSaved) { await Store.db.doc('wrongbook/meta').set({ migrated: true }); WB.metaSaved = true; }
    } else await KV.set('wrong', { items: WB.items, migrated: WB.migrated });
  } catch (e) { wbDirty = true; if (e && e.code === 'quota_exceeded') toast('存储空间已满，错词本没有保存'); }
  wbBusy = false; if (wbDirty) wbTimer = setTimeout(flushWrong, 1500);
}
function stamp(w) {
  const e = WB.items[w]; if (!e) return; const c = S.wmap.get(w);
  if (c) { e.card = c; if (S.book) { e.src = e.src || []; if (!e.src.includes(S.book.id)) e.src.push(S.book.id); } }
}
async function migrateWrong() {
  if (WB.migrated) return;
  for (const b of S.books) {
    try {
      const pr = b.id === S.book.id ? S.prog : await Store.getProgress(b.id);
      const old = pr && pr.wrong; if (!old || !Object.keys(old).length) continue;
      const mp = new Map((await Store.getWords(b)).map(x => [x.w, x]));
      for (const [w, e] of Object.entries(old)) {
        const c = mp.get(w); if (!c) continue; const cur = WB.items[w];
        if (!cur) WB.items[w] = { d: e.d, n: e.n || 1, tags: tagsOf(e), card: c, src: [b.id] };
        else { cur.n += e.n || 1; cur.tags = [...new Set([...tagsOf(cur), ...tagsOf(e)])]; if (e.d > cur.d) cur.d = e.d; if (!cur.src.includes(b.id)) cur.src.push(b.id); }
      }
    } catch {}
  }
  WB.migrated = true; saveWrong(true);
}

/* ---------- Drill logic ---------- */
const P = () => S.prog;
function curWord() {
  const p = P(); while (p.pos < p.order.length && !S.wmap.has(p.order[p.pos])) p.pos++;
  return p.pos < p.order.length ? S.wmap.get(p.order[p.pos]) : null;
}
/* Wrong-book tags: mean = 记不住 (meaning/spelling), pron = 读错了 (knows it, says it wrong). Old entries without tags count as mean. */
const TAGS = { mean: '记不住', pron: '读错了' };
const tagsOf = e => (e && e.tags && e.tags.length ? e.tags : (e ? ['mean'] : []));
function addTag(w, tag, bump = true) {

  W()[w] = { ...(prev || {}), d: today(), n: (prev ? prev.n : 0) + (bump ? 1 : 0) || 1, tags: [...tags] }; stamp(w);
}
function toggleTag(w, tag) {

  if (!e) addTag(w, tag);
  else {
    const tags = new Set(tagsOf(e)); if (tags.has(tag)) tags.delete(tag); else tags.add(tag);
    if (tags.size) W()[w] = { ...e, tags: [...tags] }; else delete W()[w];

}

function answer(known) {
  const w = curWord(); if (!w || S.reveal) return;
  const p = P(); const e = W()[w.w];
  S.last = { w: w.w, pos: p.pos, prevEntry: e ? JSON.parse(JSON.stringify(e)) : null, wasInRound: p.roundWrong.includes(w.w), prevSrs: p.srs && p.srs[w.w] ? { ...p.srs[w.w] } : null };
  srsFromDrill(w.w, known);
  if (!known) markWrong(w.w);
  p.seen = p.seen || {}; p.seen[w.w] = 1; S.last.stat = known ? 'known' : 'unknown';
  p.pos++; S.reveal = { w: w.w, known };
  saveProg(); bumpStat('seen'); bumpStat(S.last.stat); render();
  if (known && S.settings.advanceDelay) { const tok = S.reveal; setTimeout(() => { if (S.reveal === tok && S.view === 'drill') nextCard(); }, S.settings.advanceDelay * 1000); }
}

  if (S.last && S.last.stat === 'known') { S.last.stat = 'unknown'; bumpStat('known', -1); bumpStat('unknown'); }
  render();
}
function misread() {

}
function undo() {
  const l = S.last; if (!l) return; const p = P();
  p.pos = l.pos; p.finished = false;
  if (!l.wasInRound) p.roundWrong = p.roundWrong.filter(x => x !== l.w);
  if (l.prevEntry) W()[l.w] = l.prevEntry; else delete W()[l.w];
  if (l.stat) { bumpStat('seen', -1); bumpStat(l.stat, -1); }

    saveProg(true);

}
function autoSay() { if (S.view === 'drill' && !S.reveal && S.settings.autoSpeak) { const w = curWord(); if (w) say(w.w); } }
function startRound(scope) {
  const p = P();
  const srs = p.srs || {};
  const list = scope === 'wrong' ? p.roundWrong.slice() : S.words.filter(w => !(srs[w.w] && srs[w.w].easy)).map(w => w.w);
  p.round++; p.scope = scope; p.order = S.settings.shuffle ? shuffle(list) : list; p.pos = 0; p.roundWrong = []; p.finished = false;
  S.last = null; S.reveal = null; saveProg(true); S.view = 'drill'; render(); autoSay();
}
function resetBook() {

}

    case 'round-all': startRound('all'); break;
    case 'toggle-hide': S.hideMeaning = !S.hideMeaning; render(); break;
    case 'reset': confirmBox('从第 1 刷重来？', '本书的刷词进度会清零，错词本和统计保留。', '重来', () => { const hist = P().history; resetBook(); S.prog.history = hist; saveProg(true); }); break;
    case 'do-import': doImport(); break;
    case 'backup': doBackup(); break;
    case 'import-pack': doRestore(new Blob([S.importDraft.text])); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case 'ai-fill': aiFill(); break;
    case 'ai-stop': S.ai.ctl && S.ai.ctl.abort(); break;
    case 'ai-one': { const w = S.wmap.get(d.w); if (w) aiFill([w]); break; }
    case 'close-layer': if (e.target === t) closeLayer(); break;
    case 'close-layer-btn': closeLayer(); break;
    case 'remove-wrong': delete W()[d.w]; saveProg(); closeLayer(); render(); toast('已移出错词本'); break;
    case 'mode-exit': { stopListen(); const back = S.mode && S.mode.from || 'wrong'; S.mode = null; S.view = back; render(); break; }
    case 'mode-again': { const { kind, scope, from } = S.mode; S.view = from; openMode(kind, scope); break; }
    case 'c-no': scoreResult(false); modeNext(); break;
    case 'open-review': openMode('review', 'book'); break;
    case 'sd-play': speak(S.mode.sent.en, 'en', { cancel: true }); break;
    case 'sd-slow': speak(S.mode.sent.en, 'en', { cancel: true, slow: true }); break;
    case 'sd-zh': { const v = $('#sentIn') ? $('#sentIn').value : ''; S.mode.showZh = !S.mode.showZh; render(); if ($('#sentIn')) $('#sentIn').value = v; break; }
    case 'sd-check': checkSentence(); break;
    case 'c-yes': scoreResult(true); modeNext(); break;
    case 'flip': if (!S.mode.reveal) { S.mode.reveal = true; render(); } break;
    case 'm-next': modeNext(); break;
    case 'm-master': masterCurrent(); break;
    case 'l-toggle': if (S.mode.playing) { stopListen(); render(); } else listenLoop(); break;
    case 'l-next': case 'l-prev': { const was = S.mode.playing; stopListen(); S.mode.i = (S.mode.i + (d.act === 'l-next' ? 1 : -1) + S.mode.list.length) % S.mode.list.length; render(); if (was) listenLoop(); else say(curModeWord().w); break; }
    case 'check': checkSpell(); break;
    case 'hint': S.mode.hint = Math.min(S.mode.hint + 1, curModeWord().w.length); { const v = $('#spellIn').value; render(); $('#spellIn').value = v; } break;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'spellIn' && e.key === 'Enter') { e.preventDefault(); checkSpell(); return; }
  if (e.target.id === 'sentIn' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); checkSentence(); return; }
  if (S.view === 'drill' && !/INPUT|TEXTAREA/.test(e.target.tagName)) {
    if (!S.reveal && (e.key === 'ArrowLeft' || e.key === '1')) answer(true);
    else if (!S.reveal && (e.key === 'ArrowRight' || e.key === '2')) answer(false);
    else if (S.reveal && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextCard(); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'wrongSearch') { S.wrongQuery = t.value; clearTimeout(t._d); t._d = setTimeout(() => { render(); const s = $('#wrongSearch'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250); }
  if (t.id === 'impName') S.importDraft.name = t.value;
  if (t.id === 'impText') { S.importDraft.text = t.value; clearTimeout(t._d); t._d = setTimeout(() => { const pos = t.selectionStart, top = t.scrollTop; render(); const n = $('#impText'); if (n) { n.focus(); n.setSelectionRange(pos, pos); n.scrollTop = top; } }, 600); }
  if (t.id === 'set-rate') { S.settings.rate = +t.value; saveSettings(); const sm = t.closest('.setrow').querySelector('small'); if (sm) sm.textContent = S.settings.rate.toFixed(2) + '×'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'restoreFile' && t.files[0]) { doRestore(t.files[0]); t.value = ''; return; }
  if (t.id === 'wrongSrc') { S.wrongSrc = t.value; S.wrongDay = 'all'; render(); return; }
  if (t.dataset.set) { S.settings[t.dataset.set] = t.checked; saveSettings(); }
  if (t.id === 'set-rate') say('consensus');
  if (t.id === 'impFile' && t.files[0] && /\.json$/i.test(t.files[0].name)) {
    const f = t.files[0]; t.value = '';
    f.text().then(tx => {
      let j = null; try { j = JSON.parse(tx.replace(/^\uFEFF/, '')); } catch {}
      if (j && !Array.isArray(j) && Array.isArray(j.books)) { doRestore(f); return; }
      S.importDraft.text = tx; if (!S.importDraft.name) S.importDraft.name = (j && !Array.isArray(j) && j.name) || f.name.replace(/\.[^.]+$/, ''); render();
    }).catch(() => toast('读不了这个文件，请换成 .txt / .csv / .json'));
    return;
  }
  if (t.id === 'impFile' && t.files[0]) {
    const f = t.files[0]; const r = new FileReader();
    r.onload = () => { S.importDraft.text = String(r.result); if (!S.importDraft.name) S.importDraft.name = f.name.replace(/\.[^.]+$/, ''); render(); };
    r.onerror = () => toast('读不了这个文件，请换成 .txt / .csv / .json');
    r.readAsText(f);
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { flushProg(); flushStats(); flushWrong(); } else if (S.mode && S.mode.playing) holdWake(); });

/* ---------- Standalone: files, backup/restore, install, offline ---------- */
function saveFile(name, text) {
  const blob = new Blob([text], { type: 'application/json' }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast('已导出 ' + name);
}
async function doBackup() {
  const list = await KV.get('books', []); const books = [];
  for (const b of list) books.push({ id: b.id, name: b.name, created: b.created, words: await KV.get('words:' + b.id, []) });
  const progress = {}; for (const b of [DEMO, ...list]) { const p = await KV.get('prog:' + b.id, null); if (p) progress[b.id] = p; }
  await flushWrong(); await flushStats();
  const data = { type: 'wordcards-backup', version: 1, exported: new Date().toISOString(), books, progress, wrong: { items: WB.items, migrated: true }, stats: ST, settings: S.settings };
  saveFile('wordcards-backup-' + today() + '.json', JSON.stringify(data));
}
async function doRestore(file) {
  let data; try { data = JSON.parse(await file.text()); } catch { toast('这个文件不是有效的备份'); return; }
  if (!data || (data.type !== 'wordcards-backup' && !Array.isArray(data.books))) { toast('这个文件不是词卡速刷的备份或词书包'); return; }
  const nb = (data.books || []).length, np = Object.keys(data.progress || {}).length, nw = Object.keys((data.wrong && data.wrong.items) || {}).length;
  confirmBox('导入这个文件？', `包含 ${nb} 本词书${np ? `、${np} 本书的进度` : ''}${nw ? `、${nw} 个错词` : ''}。同名词书和它的进度会被覆盖，错词本和统计会合并。`, '导入', async () => {
    toast('正在导入…');
    try {
      for (const b of data.books || []) await Store.saveBook({ id: b.id, name: b.name, created: b.created }, b.words || []);
      for (const [id, p] of Object.entries(data.progress || {})) await KV.set('prog:' + id, p);
      for (const [w, e] of Object.entries((data.wrong && data.wrong.items) || {})) {
        const cur = WB.items[w];
        if (!cur) WB.items[w] = e;
        else { cur.n = Math.max(cur.n || 1, e.n || 1); cur.tags = [...new Set([...tagsOf(cur), ...tagsOf(e)])]; if (e.d > cur.d) cur.d = e.d; cur.src = [...new Set([...(cur.src || []), ...(e.src || [])])]; cur.card = cur.card || e.card; }
      }
      WB.migrated = true; saveWrong(true);
      for (const [d, o] of Object.entries((data.stats && data.stats.days) || {})) {
        const c = ST.days[d] || (ST.days[d] = {});
        for (const [k, v] of Object.entries(o)) { if (k === 'm') c.m = { ...(v || {}), ...(c.m || {}) }; else c[k] = Math.max(c[k] || 0, v || 0); }
      }
      saveStats(true);
      S.books = [DEMO, ...(await Store.listBooks()).sort((a, b) => (a.created || 0) - (b.created || 0))];
      await loadBook(S.books.find(b => b.id === S.settings.current) ? S.settings.current : (data.books && data.books[0] ? data.books[0].id : DEMO_ID));
      S.view = 'library'; render(); toast(`导入完成：${nb} 本词书`);
    } catch (e) { toast(e && e.code === 'quota_exceeded' ? '手机存储空间不足，导入没有完成' : '导入没有完成，请再试一次'); }
  });
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.view === 'settings') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('已安装到桌面'); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

boot();
</script>
